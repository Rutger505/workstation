# Temporary neutral look until the theme lands; colors mirror hypr/colors.lua and waybar/colors.css
$background = rgb(1e1e1e)
$foreground = rgb(d0d0d0)
$active = rgb(9a9a9a)
$inactive = rgb(3a3a3a)
$critical = rgb(e06c6c)
$font = JetBrainsMono NL Nerd Font, monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    color = $background
}

label {
    text = $TIME
    color = $foreground
    font_family = $font
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 300, 44
    rounding = 0
    outline_thickness = 2
    outer_color = $inactive
    inner_color = $background
    font_color = $foreground
    check_color = $active
    fail_color = $critical
    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
